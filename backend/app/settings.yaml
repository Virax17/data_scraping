# First-boot defaults. After first startup these live in Mongo and are edited
# from the Settings UI — this file is never read again except to seed new keys.

auto_mode: false                  # off by default — reveal never fires without an explicit confirm
auto_approve_confidence: 0.8

sweep_cap_per_company: 1000       # max free previews pulled per company
reveal_cap_per_company: 10        # fallback used when a company's size_tier is unknown
run_credit_budget: 0              # 0 = any reveal attempt is flagged over-budget and needs a forced confirm

# Per-company reveal cap scaled by size_tier — bigger companies get more
# contacts revealed, smaller companies fewer. Falls back to
# reveal_cap_per_company above when a company's size_tier couldn't be
# determined (org headcount missing).
reveal_cap_by_size_tier:
  micro: 5
  small: 6
  mid: 10
  large: 15
  enterprise: 20

engine_order: [apollo, lusha]
lusha_fallback: true
reveal_phone: false               # email-only by default

# When true, company resolution (resolve_company) NEVER calls Apollo's paid
# organization_enrich or Lusha's paid company_search_enrich -- only Apollo's
# free organization_search (name-based) is used. This is a separate cost
# center from the reveal budget gate above: resolution runs automatically for
# every uploaded company regardless of auto_mode/run_credit_budget, so those
# settings alone do NOT stop Apollo/Lusha credit spend.
#
# Tradeoff (verified against the live Apollo API, not estimated): free
# organization_search never returns estimated_num_employees, industry,
# keywords, or short_description -- so in this mode size_tier is ~always
# unresolved (every company falls back to the flat reveal_cap_per_company
# instead of the size-tiered caps) and customer_type is ~always "ambiguous"
# (the keyword/industry-tag classifier has nothing to read; only literal
# icp_companies.json name matches still resolve). It also sometimes fails to
# recover a domain for companies that didn't already have one in the
# uploaded file (free search can mismatch to an unrelated subsidiary/page).
# Deliberately kept true anyway -- zero Apollo/Lusha spend, chosen with this
# tradeoff known -- flip to false for accurate size_tier/customer_type at
# the cost of ~1 Apollo credit per company (this was ~308 of a 361-credit
# run) plus occasional Lusha credits for domain recovery.
free_resolution_only: true

# llm_provider: "anthropic" | "cerebras". Cerebras is the free-tier default
# for local testing (5 req/min, 8K context cap) — switch to anthropic for
# production-quality judgments. judge_batch_size and llm_model are per-provider
# below; only the active provider's values are used.
llm_provider: cerebras
llm_model: claude-opus-4-8          # used when llm_provider: anthropic
judge_batch_size: 150               # used when llm_provider: anthropic

cerebras_model: gpt-oss-120b
cerebras_judge_batch_size: 40        # trimmed prompt (PR1) + positional refs (PR4) give headroom under the 8K context cap

verdict_cache: true
never_send_titles: []             # cost-control pre-trim; OFF by default — LLM sees everyone

contact_freshness_days: 90        # skip re-enriching contacts revealed within this window

size_tier_bounds:
  micro: [0, 49]
  small: [50, 200]
  mid: [201, 1000]
  large: [1001, 5000]
  enterprise: [5001, null]

# Seniority bands used only when a company exceeds sweep_cap_per_company —
# pulled in this order until the cap is reached, most senior first.
seniority_bands:
  - [owner, founder, c_suite, partner]
  - [vp, head, director]
  - [manager, senior]
  - [entry]

# Default Apollo-style search customization, applied to every run unless the
# upload form overrides it. Empty by default (matches today's behavior:
# broad, unfiltered sweep). All are optional; see app/core/search_filters.py
# and providers/apollo_client.py::people_search_page for how they're sent.
search_defaults:
  titles: []                 # person_titles — narrow the sweep to specific job titles
  keywords: ""                # q_keywords — free-text profile keyword match
  headcount_ranges: []        # organization_num_employees_ranges, e.g. ["1,50", "51,200"]
